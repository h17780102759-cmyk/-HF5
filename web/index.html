<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>闲赋</title>
<style>
  :root{
    --bg:#1e1f22; --panel:#26282c; --text:#d6d8dc; --dim:#8b8f96;
    --accent:#5b8dd6; --line:#34373c; --btn:#33363b; --btn-h:#3d4147;
    --ed-size:17px; --ed-line:2.1; --ed-width:760px;
    --ed-font:"Microsoft YaHei","PingFang SC",serif;
    --r:10px; --r2:14px; --r3:20px; --r-pill:999px;
    --dur:.16s; --ease:cubic-bezier(.4,0,.2,1);
    --s1:0 1px 2px rgba(0,0,0,.3);
    --s2:0 4px 14px rgba(0,0,0,.35);
    --s3:0 16px 48px rgba(0,0,0,.55);
  }
  body.theme-light{
    --bg:#fbfbf9; --panel:#f4f4f0; --text:#24262b; --dim:#7c8088;
    --accent:#3d6fa8; --line:#e0e0d9; --btn:#e9e9e3; --btn-h:#dfdfd8;
    --s1:0 1px 2px rgba(0,0,0,.06); --s2:0 4px 14px rgba(0,0,0,.08);
    --s3:0 16px 48px rgba(0,0,0,.14);
  }
  body.theme-sepia{
    --bg:#eee6d3; --panel:#e8e0cc; --text:#43382a; --dim:#8a7d6a;
    --accent:#8a6d3b; --line:#d8cdb6; --btn:#e0d7c1; --btn-h:#d6cbb2;
    --s1:0 1px 2px rgba(80,60,30,.08); --s2:0 4px 14px rgba(80,60,30,.11);
    --s3:0 16px 48px rgba(80,60,30,.2);
  }
  body.theme-ink{
    --bg:#0d0e10; --panel:#16181c; --text:#c9ccd1; --dim:#6e7278;
    --accent:#7aa2e0; --line:#26292e; --btn:#1c1f24; --btn-h:#252932;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
    position:relative;
  }

  /* ===== 纹理层（铺满全屏，位于编辑器下方） ===== */
  #texture{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:var(--tex-opacity, 0.08);
    transition:opacity .3s var(--ease);
    mix-blend-mode:var(--tex-blend, normal);
  }

  /* 纹理 1：细纸纹 */
  body[data-tex="paper"] #texture{
    background-image:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(128,128,128,.05) 2px 3px),
      repeating-linear-gradient(90deg, transparent 0 3px, rgba(128,128,128,.035) 3px 4px);
  }
  /* 纹理 2：布纹 */
  body[data-tex="cloth"] #texture{
    background-image:
      repeating-linear-gradient(45deg, rgba(128,128,128,.06) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(-45deg, rgba(128,128,128,.06) 0 1px, transparent 1px 5px);
  }
  /* 纹理 3：网格 */
  body[data-tex="grid"] #texture{
    background-image:
      linear-gradient(rgba(128,128,128,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(128,128,128,.10) 1px, transparent 1px);
    background-size:26px 26px;
  }
  /* 纹理 4：横线稿纸 */
  body[data-tex="line"] #texture{
    background-image:repeating-linear-gradient(
      to bottom,
      transparent 0 31px,
      rgba(128,128,128,.14) 31px 32px
    );
  }
  /* 纹理 5：细点 */
  body[data-tex="dot"] #texture{
    background-image:radial-gradient(rgba(128,128,128,.22) 1px, transparent 1px);
    background-size:14px 14px;
  }
  /* 纹理 6：斜纹 */
  body[data-tex="diag"] #texture{
    background-image:repeating-linear-gradient(
      -45deg,
      rgba(128,128,128,.05) 0 2px,
      transparent 2px 8px
    );
  }
  /* 无纹理 */
  body[data-tex="none"] #texture{ display:none; }

  /* 内容层需要盖在纹理上方 */
  header, #editor, footer, #drawerMask, #drawer,
  #panelMask, #setMask{ position:relative; z-index:1; }

  /* ===== 顶栏 ===== */
  header{
    height:40px; flex:0 0 40px; display:flex; align-items:center;
    gap:6px; padding:0 10px; background:var(--panel);
    border-bottom:1px solid var(--line); font-size:12px;
    box-shadow:var(--s1); user-select:none; z-index:20;
  }
  /* ===== 品牌区：艺术标题 + 印章 ===== */
  .brand{
    display:inline-flex; align-items:center; gap:6px;
    margin-right:10px; user-select:none;
  }

  header .title{
    font-family:"STKaiti","KaiTi","Kaiti SC","楷体",serif;
    font-size:19px;
    font-weight:700;
    letter-spacing:.14em;
    padding-right:2px;
    /* 渐变质感 */
    background:linear-gradient(
      135deg,
      var(--text) 0%,
      var(--accent) 55%,
      var(--text) 100%
    );
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));
    transition:filter var(--dur) var(--ease);
  }
  header .title:hover{
    filter:drop-shadow(0 1px 4px rgba(91,141,214,.45)) brightness(1.08);
  }

  /* 印章：红色小方章，点缀书法感 */
  .seal{
    display:inline-flex; align-items:center; justify-content:center;
    width:17px; height:17px;
    font-family:"STKaiti","KaiTi","楷体",serif;
    font-size:11px; font-weight:700; line-height:1;
    color:#fff;
    background:#b8412f;
    border-radius:3px;
    box-shadow:0 1px 2px rgba(0,0,0,.3), inset 0 0 0 .5px rgba(255,255,255,.2);
    transform:translateY(-3px) rotate(-3deg);
    opacity:.92;
    transition:transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    flex-shrink:0;
  }
  .brand:hover .seal{
    transform:translateY(-3px) rotate(0deg) scale(1.08);
    opacity:1;
  }

  /* 亮色/护眼主题下描边反向 */
  body.theme-light header .title,
  body.theme-sepia header .title{
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.1));
  }
  header .spacer{flex:1;}
  button{
    background:var(--btn); color:var(--text); border:1px solid var(--line);
    border-radius:var(--r-pill); padding:6px 16px; font-size:12px; cursor:pointer;
    font-family:inherit;
    transition:background var(--dur) var(--ease),
               border-color var(--dur) var(--ease),
               box-shadow var(--dur) var(--ease),
               transform .08s var(--ease);
  }
  button:hover{background:var(--btn-h); border-color:var(--accent); box-shadow:var(--s1);}
  button:active{transform:scale(.97);}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.primary:hover{filter:brightness(1.12); box-shadow:0 2px 10px rgba(91,141,214,.35);}

  #menuWrap{position:relative;}
  #menuPanel{
    position:absolute; top:calc(100% + 8px); right:0; min-width:150px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r2);
    box-shadow:var(--s2); padding:7px; display:none; flex-direction:column; z-index:30;
  }
  #menuPanel.show{display:flex;}
  .menu-item{
    padding:10px 14px; border-radius:var(--r); cursor:pointer; font-size:12.5px;
    transition:background var(--dur) var(--ease);
  }
  .menu-item:hover{background:var(--btn-h);}
  .menu-sep{height:1px; background:var(--line); margin:5px 8px; border-radius:var(--r-pill);}

  /* ===== 编辑器 ===== */
  #editor{flex:1; overflow:hidden;}

  /* ===== 底栏 ===== */
  footer{
    height:28px; flex:0 0 28px; display:flex; align-items:center;
    gap:14px; padding:0 12px; background:var(--panel);
    border-top:1px solid var(--line); font-size:11.5px;
    color:var(--dim); user-select:none;
  }
  footer .spacer{flex:1;}
  #status.ok{color:#6bbf7b;}
  #status.warn{color:#d9a54a;}

  /* ===== 抽屉 ===== */
  #drawerMask{
    position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; z-index:40;
    backdrop-filter:blur(2px);
  }
  #drawerMask.show{display:block;}
  #drawer{
    position:fixed; top:0; left:0; bottom:0; width:min(300px,82vw);
    background:var(--panel); border-right:1px solid var(--line);
    border-radius:0 var(--r3) var(--r3) 0;
    box-shadow:var(--s3); z-index:41; display:flex; flex-direction:column;
    transform:translateX(-102%); transition:transform .22s var(--ease);
    padding-top:env(safe-area-inset-top,0px);
  }
  #drawer.show{transform:translateX(0);}
  #drawerHead{
    padding:14px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px; font-size:13px;
  }
  #drawerHead .t{font-weight:bold; flex:1;}
  #drawerBody{flex:1; overflow-y:auto; padding:10px;}

  .bk-item{
    display:flex; align-items:center; gap:10px; padding:13px 14px; margin:6px 0;
    border-radius:var(--r2); cursor:pointer; font-size:13px;
    background:var(--btn); border:1px solid transparent;
    transition:background var(--dur) var(--ease),
               border-color var(--dur) var(--ease),
               box-shadow var(--dur) var(--ease),
               transform .1s var(--ease);
  }
  .bk-item:hover{background:var(--btn-h); box-shadow:var(--s1); transform:translateY(-1px);}
  .bk-item.active{
    border-color:var(--accent);
    box-shadow:inset 4px 0 0 var(--accent), var(--s1);
    background:var(--btn-h);
  }
  .bk-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bk-meta{color:var(--dim); font-size:11px;}

  .ch-list{margin:4px 0 10px 14px; border-left:2px solid var(--line); padding-left:8px; border-radius:var(--r-pill);}
  .ch-item{
    display:flex; align-items:center; gap:8px; padding:10px 12px; margin:3px 0;
    border-radius:var(--r); cursor:pointer; font-size:12.5px; color:var(--dim);
    transition:background var(--dur) var(--ease), color var(--dur) var(--ease),
               box-shadow var(--dur) var(--ease);
  }
  .ch-item:hover{background:var(--btn-h); color:var(--text);}
  .ch-item.active{
    background:var(--btn-h); color:var(--text);
    box-shadow:inset 3px 0 0 var(--accent);
    font-weight:500;
  }
  .ch-title{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ch-meta{color:var(--dim); font-size:10.5px;}
  .ch-add{color:var(--accent); justify-content:center; font-weight:500;}
  .ch-add:hover{background:var(--btn-h);}

  .del{
    background:none; border:none; color:#d98a8a; cursor:pointer;
    font-size:15px; padding:3px 8px; border-radius:var(--r-pill);
    transition:background var(--dur) var(--ease), transform .08s var(--ease);
  }
  .del:hover{background:rgba(217,138,138,.16); transform:scale(1.1);}

  .empty{
    color:var(--dim); font-size:12px; text-align:center; padding:24px 12px; line-height:1.8;
  }

  /* ===== 通用面板 ===== */
  #panelMask{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:50;
    padding:5vh 4vw; backdrop-filter:blur(3px);
  }
  #panelMask.show{display:flex; align-items:center; justify-content:center;}
  #panel{
    width:min(760px,100%); max-height:90vh; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r3);
    box-shadow:var(--s3); overflow:hidden;
  }
  #panelHead{
    padding:13px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; font-size:13px;
  }
  #panelHead .t{font-weight:bold; flex:1;}
  #panelBody{flex:1; overflow-y:auto; padding:14px 16px;}

  .p-title{font-size:14px; font-weight:bold; color:var(--accent); margin-bottom:10px;}
  .p-sub{font-size:12px; color:var(--dim); margin:14px 0 8px; font-weight:bold;}
  .p-foot{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
    display:flex; gap:10px;
  }
  .p-foot button{flex:1; padding:10px;}

  .row{display:flex; gap:9px; flex-wrap:wrap; align-items:center;}
  .chip{
    padding:8px 16px; font-size:12.5px; border-radius:var(--r-pill); cursor:pointer;
    background:var(--btn); border:1px solid var(--line);
    transition:background var(--dur) var(--ease),
               border-color var(--dur) var(--ease),
               color var(--dur) var(--ease),
               box-shadow var(--dur) var(--ease),
               transform .08s var(--ease);
  }
  .chip:hover{border-color:var(--accent); background:var(--btn-h);}
  .chip:active{transform:scale(.96);}
  .chip.active{
    background:var(--accent); border-color:var(--accent); color:#fff;
    box-shadow:0 2px 10px rgba(91,141,214,.3);
  }

  .item{
    padding:10px 13px; margin:6px 0; background:var(--btn);
    border-radius:var(--r2); border-left:3px solid var(--line);
    font-size:12.5px; word-break:break-word;
  }
  .item.warn{border-left-color:#d9a54a;}
  .item .ln{color:var(--dim); margin-right:8px;}
  .was{color:#d98a8a; text-decoration:line-through;}
  .now{color:#6bbf7b;}
  .g-title{color:var(--accent); font-size:12px; font-weight:bold; margin:14px 0 8px;}

  .sent-card{
    background:var(--bg); border:1px solid var(--line); border-radius:var(--r3);
    padding:28px 22px; margin-bottom:14px; min-height:120px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color var(--dur) var(--ease),
               box-shadow var(--dur) var(--ease),
               transform .1s var(--ease);
  }
  .sent-card:hover{
    border-color:var(--accent);
    box-shadow:var(--s2);
    transform:translateY(-1px);
  }
  .sent-text{
    font-family:var(--ed-font); font-size:16px; line-height:1.9;
    text-align:center; transition:opacity .2s;
  }
  .sent-input{
    width:100%; min-height:76px; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:var(--r2); padding:12px 14px;
    font-family:inherit; font-size:13px; line-height:1.7; resize:vertical; outline:none;
    transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .sent-input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(91,141,214,.16);
  }
  .hint{color:var(--dim); font-size:11.5px;}

  /* ===== 设置面板 ===== */
  #setMask{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:60;
    padding:5vh 4vw; backdrop-filter:blur(3px);
  }
  #setMask.show{display:flex; align-items:center; justify-content:center;}
  #setPanel{
    width:min(460px,100%); max-height:88vh; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r3);
    box-shadow:var(--s3); overflow:hidden;
  }
  #setHead{
    padding:14px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; font-size:13px;
  }
  #setHead .t{font-weight:bold; flex:1;}
  #setBody{flex:1; overflow-y:auto; padding:10px 18px 18px;}
  .set-group{padding:16px 0; border-bottom:1px solid var(--line);}
  .set-group:last-child{border-bottom:none;}
  .set-label{
    font-size:13px; font-weight:bold; margin-bottom:11px;
    display:flex; align-items:center; gap:8px;
  }
  .set-label .val{color:var(--accent); font-weight:normal; font-size:12px;}
  .set-slider{
    width:100%; height:6px; accent-color:var(--accent); cursor:pointer;
    border-radius:var(--r-pill);
  }

  @media (max-width:720px){
    body{height:100dvh;}
    header{height:auto; flex:0 0 auto; padding:6px 8px; flex-wrap:wrap; gap:5px;}
    header button{padding:7px 10px; font-size:12.5px;}
    #panelMask{padding:0;}
    #panel{width:100%; height:100%; max-height:100%; border-radius:0;}
    #setMask{padding:0;}
    #setPanel{width:100%; height:100%; max-height:100%; border-radius:0;}
    .menu-item{padding:11px 14px; font-size:13px;}
  }
</style>
</head>
<body class="theme-dark">

<header>
  <span class="brand">
    <span class="title">闲赋</span>
    <span class="seal">文</span>
  </span>
  <span class="spacer"></span>
  <button id="btnUndo" title="撤销">↶</button>
  <button id="btnRedo" title="重做">↷</button>
  <button id="btnDrawer">书籍</button>
  <div id="menuWrap">
    <button id="btnMenu">工具 ▾</button>
    <div id="menuPanel">
      <div class="menu-item" data-act="typos">错别字</div>
      <div class="menu-item" data-act="idea">后文灵感</div>
      <div class="menu-item" data-act="format">一键排版</div>
      <div class="menu-sep"></div>
      <div class="menu-item" data-act="export">导出 Word</div>
      <div class="menu-sep"></div>
      <div class="menu-item" data-act="settings">设置</div>
    </div>
  </div>
  <button id="btnSave" class="primary">保存</button>
</header>

<div id="editor"></div>

<footer>
  <span id="statChars">0 字</span>
  <span id="statParas">0 段</span>
  <span class="spacer"></span>
  <span id="status"></span>
</footer>

<!-- 背景纹理层 -->
<div id="texture" aria-hidden="true"></div>

<!-- 抽屉 -->
<div id="drawerMask"></div>
<div id="drawer">
  <div id="drawerHead">
    <button id="drawerNewBook" class="primary">＋ 新书</button>
    <span class="t">书籍</span>
    <button id="drawerClose">关闭</button>
  </div>
  <div id="drawerBody"></div>
</div>

<!-- 通用面板 -->
<div id="panelMask">
  <div id="panel">
    <div id="panelHead">
      <span class="t">面板</span>
      <button id="panelClose">关闭</button>
    </div>
    <div id="panelBody"></div>
  </div>
</div>

<!-- 设置面板 -->
<div id="setMask">
  <div id="setPanel">
    <div id="setHead">
      <span class="t">写作环境</span>
      <button id="setClose">关闭</button>
    </div>
    <div id="setBody">
      <div class="set-group">
        <div class="set-label">主题</div>
        <div class="row">
          <div class="chip" data-theme="dark">暗色</div>
          <div class="chip" data-theme="light">亮色</div>
          <div class="chip" data-theme="sepia">护眼</div>
          <div class="chip" data-theme="ink">墨色</div>
        </div>
      </div>
      <div class="set-group">
        <div class="set-label">字号 <span class="val" id="valSize">17px</span></div>
        <input type="range" class="set-slider" id="rngSize" min="14" max="26" step="1" value="17">
      </div>
      <div class="set-group">
        <div class="set-label">行距 <span class="val" id="valLine">2.1</span></div>
        <input type="range" class="set-slider" id="rngLine" min="14" max="30" step="1" value="21">
      </div>
      <div class="set-group">
        <div class="set-label">正文宽度 <span class="val" id="valWidth">760px</span></div>
        <input type="range" class="set-slider" id="rngWidth" min="480" max="1100" step="20" value="760">
      </div>
      <div class="set-group">
        <div class="set-label">背景纹理</div>
        <div class="row" id="texRow">
          <div class="chip" data-tex-opt="none">无</div>
          <div class="chip" data-tex-opt="paper">纸纹</div>
          <div class="chip" data-tex-opt="cloth">布纹</div>
          <div class="chip" data-tex-opt="grid">网格</div>
          <div class="chip" data-tex-opt="line">稿纸</div>
          <div class="chip" data-tex-opt="dot">细点</div>
          <div class="chip" data-tex-opt="diag">斜纹</div>
        </div>
      </div>
      <div class="set-group">
        <div class="set-label">纹理浓度 <span class="val" id="valTex">8%</span></div>
        <input type="range" class="set-slider" id="rngTex" min="0" max="80" step="1" value="8">
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
